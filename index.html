        <style>
            :root {
                --bg: #f5f8fd;
                --cd: #fff;
                --tx: #14233a;
                --mu: #6b7c93;
                --pr: #3b8ef0;
                --pl: color-mix(in srgb,var(--pr) 16%,var(--cd));
                --bd: #e3e9f2;
                --rd: #e5484d;
                color-scheme: light
            }

            @media(prefers-color-scheme: dark) {
                :root:not([data-th=l]) {
                    --bg:#0e1623;
                    --cd: #18222f;
                    --tx: #e8eef7;
                    --mu: #8a9bb3;
                    --bd: #26344a;
                    color-scheme: dark
                }
            }

            :root[data-th=d] {
                --bg: #0e1623;
                --cd: #18222f;
                --tx: #e8eef7;
                --mu: #8a9bb3;
                --bd: #26344a;
                color-scheme: dark
            }

            * {
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent
            }

            body {
                margin: 0;
                font: 16px system-ui,sans-serif;
                background: var(--bg);
                color: var(--tx);
                height: 100dvh;
                display: flex;
                flex-direction: column;
                padding-top: env(safe-area-inset-top)
            }

            header {
                padding: 16px 20px 8px;
                display: flex;
                align-items: center;
                gap: 10px
            }

            header h1 {
                font-size: 24px;
                margin: 0;
                flex: 1
            }

            button {
                font: inherit;
                color: inherit;
                border: 0;
                background: none;
                cursor: pointer
            }

            #main {
                flex: 1;
                overflow: auto;
                padding: 4px 16px 96px
            }

            .it {
                display: flex;
                align-items: center;
                gap: 12px;
                background: var(--cd);
                border: 1px solid var(--bd);
                border-radius: 14px;
                padding: 12px 14px;
                margin: 8px 0
            }

            .it .b {
                flex: 1;
                min-width: 0
            }

            .it .t {
                font-weight: 600;
                overflow-wrap: anywhere
            }

            .it .w {
                font-size: 13px;
                color: var(--mu);
                margin-top: 2px
            }

            .it .w.o {
                color: var(--rd)
            }

            .ck {
                width: 26px;
                height: 26px;
                border-radius: 50%;
                border: 2px solid var(--pr);
                flex: none;
                display: grid;
                place-items: center;
                color: #fff;
                font-size: 15px
            }

            .ck.on {
                background: var(--pr)
            }

            .bell {
                width: 26px;
                text-align: center;
                flex: none;
                font-size: 18px
            }

            h3 {
                font-size: 13px;
                text-transform: uppercase;
                letter-spacing: .06em;
                color: var(--mu);
                margin: 20px 4px 4px
            }

            .em {
                text-align: center;
                color: var(--mu);
                margin-top: 64px;
                line-height: 1.5
            }

            nav {
                display: flex;
                background: var(--cd);
                border-top: 1px solid var(--bd);
                padding-bottom: env(safe-area-inset-bottom)
            }

            nav button {
                flex: 1;
                padding: 10px 0 8px;
                font-size: 12px;
                color: var(--mu);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2px
            }

            nav button span {
                display: flex
            }

            nav button.on {
                color: var(--pr);
                font-weight: 600
            }

            #fab {
                position: fixed;
                right: 18px;
                bottom: calc(76px + env(safe-area-inset-bottom));
                width: 58px;
                height: 58px;
                border-radius: 50%;
                background: var(--pr);
                color: #fff;
                font-size: 30px;
                box-shadow: 0 6px 18px color-mix(in srgb,var(--pr) 40%,transparent)
            }

            #sh {
                position: fixed;
                inset: 0;
                background: #0006;
                display: none;
                align-items: flex-end;
                z-index: 5
            }

            #sh.on {
                display: flex
            }

            .sheet {
                background: var(--cd);
                width: 100%;
                border-radius: 22px 22px 0 0;
                padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
                max-height: 90dvh;
                overflow: auto
            }

            .sheet input {
                width: 100%;
                font: inherit;
                padding: 13px;
                border-radius: 12px;
                border: 1px solid var(--bd);
                background: var(--bg);
                color: var(--tx);
                margin: 6px 0
            }

            .row {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                margin: 8px 0
            }

            .chip {
                padding: 8px 13px;
                border-radius: 20px;
                background: var(--pl);
                font-size: 14px
            }

            .chip.on {
                background: var(--pr);
                color: #fff
            }

            .seg {
                display: flex;
                background: var(--pl);
                border-radius: 12px;
                padding: 3px
            }

            .seg button {
                flex: 1;
                padding: 9px;
                border-radius: 10px
            }

            .seg .on {
                background: var(--pr);
                color: #fff
            }

            .go {
                width: 100%;
                background: var(--pr);
                color: #fff;
                padding: 14px;
                border-radius: 14px;
                font-weight: 600;
                margin-top: 10px
            }

            .del {
                width: 100%;
                color: var(--rd);
                padding: 12px
            }

            .lab {
                font-size: 13px;
                color: var(--mu);
                margin-top: 10px
            }

            svg {
                width: 22px;
                height: 22px;
                stroke: currentColor;
                fill: none;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
                flex: none
            }

            .bell svg {
                color: var(--pr)
            }

            .seg svg {
                width: 16px;
                height: 16px;
                vertical-align: -3px;
                margin-right: 4px
            }

            .ck svg {
                width: 16px;
                height: 16px;
                stroke: #fff;
                stroke-width: 3
            }

            #fab svg {
                width: 28px;
                height: 28px;
                stroke-width: 2.5
            }

            #bk svg {
                width: 26px;
                height: 26px
            }

            .it>svg {
                color: var(--mu)
            }

            .chip svg {
                width: 16px;
                height: 16px;
                vertical-align: -3px;
                margin-right: 4px
            }

            .w svg {
                width: 13px;
                height: 13px;
                vertical-align: -2px;
                margin-right: 2px
            }

            .sheet select {
                font: inherit;
                padding: 12px;
                border-radius: 12px;
                border: 1px solid var(--bd);
                background: var(--bg);
                color: var(--tx)
            }

            #f-n {
                width: 80px
            }

            .it.s-c {
                background: color-mix(in srgb,var(--ic,var(--pr)) 16%,var(--cd));
                border-color: transparent
            }

            .it.s-m {
                background: none;
                border-width: 0 0 1px;
                border-radius: 0
            }

            .it.hc {
                border-left: 5px solid var(--ic)
            }

            .ck {
                border-color: var(--ic,var(--pr))
            }

            .ck.on {
                background: var(--ic,var(--pr))
            }

            .bell svg {
                color: var(--ic,var(--pr))
            }

            .sw {
                width: 34px;
                height: 34px;
                border-radius: 50%;
                border: 3px solid transparent;
                display: grid;
                place-items: center;
                color: var(--mu);
                flex: none
            }

            .sw.on {
                border-color: var(--tx)
            }

            .sw.none {
                background: var(--pl)
            }

            .sw svg {
                width: 16px;
                height: 16px
            }

            .ib {
                padding: 7px;
                border-radius: 50%;
                display: flex
            }

            .ib.on {
                background: var(--pl);
                color: var(--pr)
            }

            #sb {
                padding: 0 16px 6px
            }

            #sb input {
                width: 100%;
                font: inherit;
                padding: 11px 14px;
                border-radius: 12px;
                border: 1px solid var(--bd);
                background: var(--cd);
                color: var(--tx)
            }

            .cd {
                background: var(--cd);
                border: 1px solid var(--bd);
                border-radius: 14px;
                padding: 6px 14px 12px
            }

            .pv {
                height: 48px;
                border-radius: 12px;
                margin: 8px 0;
                border: 1px solid var(--bd)
            }

            input[type=color] {
                width: 42px;
                height: 34px;
                padding: 0;
                border: 0;
                background: none
            }

            input[type=range] {
                width: 100%
            }

            .cb header {
                background: color-mix(in srgb,var(--cd) 85%,transparent);
                backdrop-filter: blur(8px)
            }

            .cb h3 {
                background: var(--cd);
                display: inline-block;
                padding: 4px 10px;
                border-radius: 10px
            }

            .cb .it.s-m {
                background: var(--cd)
            }

            .cb .em {
                background: var(--cd);
                border-radius: 16px;
                padding: 20px;
                margin: 40px 8px 0
            }
        </style>
    </head>
    <body>
        <header>
            <button id="bk" hidden></button>
            <h1 id="ti"></h1>
            <button id="inst" hidden class="chip">Instalar</button>
            <button id="ed" hidden class="chip">Editar</button>
            <button id="sbt" class="ib" aria-label="Buscar"></button>
            <button id="cfg" class="ib" aria-label="Configurações"></button>
        </header>
        <div id="sb" hidden>
            <input id="sbi" type="search" placeholder="Buscar pelo nome...">
        </div>
        <div id="main"></div>
        <button id="fab" aria-label="Adicionar"></button>
        <nav id="nav"></nav>
        <div id="sh">
            <div class="sheet" id="sc"></div>
        </div>
        <script>
            const $ = s => document.querySelector(s);
            let S = JSON.parse(localStorage.getItem('lembra') || 'null') || {
                items: [],
                lists: []
            }
              , tab = 'r'
              , cur = null
              , reg = null
              , q = ''
              , sbOpen = false
              , cfgOpen = false;
            S.cfg = Object.assign({
                th: 'a',
                ac: '#3b8ef0',
                s1: 10,
                s2: 60
            }, S.cfg || {});
            S.cfg.st = Object.assign({
                r: 'p',
                t: 'p',
                l: 'p'
            }, S.cfg.st || {});
            S.cfg.bg = Object.assign({
                k: 'n',
                c1: '#cfe3ff',
                c2: '#f3d9ff',
                a: 160
            }, S.cfg.bg || {});
            const nm = x => x.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
              , mt = x => !q || nm(x).includes(nm(q))
              , emp = h => q ? '<div class="em">Nada encontrado.</div>' : h;
            const PAL = ['#e5484d', '#f76b15', '#f5b301', '#30a46c', '#12a594', '#3b8ef0', '#6e56cf', '#d6409f', '#6b7c93']

              , BGS = ['#f5f8fd', '#cfe3ff', '#ffe4d6', '#d9f2e3', '#f3d9ff', '#fff3c4', '#1f2a3a', '#000000'];
            const lbl = m => m < 60 ? m + ' min' : m / 60 + ' h';

                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;'
            }[c]));
            const fmt = t => new Date(t).toLocaleString('pt-BR', {
                weekday: 'short',
                day: 'numeric',
                month: 'short',
                hour: '2-digit',
                minute: '2-digit'
            });
            const loc = d => new Date(d - new Date(d).getTimezoneOffset() * 6e4).toISOString().slice(0, 16);

            $('#cfg').innerHTML = I.gear;

            $('#bk').innerHTML = I.back;

            const byId = id => S.items.find(i => i.id == id);
            const cl = (c, k) => `class="it s-${S.cfg.st[k]}${c ? ' hc' : ''}"${c ? ` style="--ic:${c}"` : ''}`;

                const o = i.type == 't' && !i.done && i.when < Date.now();

            }
            const pend = ty => S.items.filter(i => i.type == ty && !i.done && mt(i.title)).sort( (a, b) => a.when - b.when);
            function render() {
                $('#nav').innerHTML = TABS.map( ([k,e,n]) => `<button class="${k == tab ? 'on' : ''}" data-tab="${k}"><span>${I[e]}</span>${n}</button>`).join('');
                $('#bk').hidden = !(cur || cfgOpen);
                $('#ed').hidden = !cur || cfgOpen;
                $('#fab').hidden = cfgOpen || (tab == 'c' && !cur);

                    $('#ti').textContent = 'Configurações';
                    $('#main').innerHTML = cfgHtml();

                }
                let h = ''

                    $('#ti').textContent = L.name;
                    const mine = ty => pend(ty).filter(i => i.lists.includes(cur));
                    const t = mine('t')
                      , r = mine('r');
                    h = (t.length ? '<h3>Tarefas</h3>' + t.map(row).join('') : '') + (r.length ? '<h3>Lembretes</h3>' + r.map(row).join('') : '') || emp('<div class="em">Lista vazia.<br>Toque em + para adicionar.</div>')
                } else {
                    $('#ti').textContent = TABS.find(x => x[0] == tab)[2];
                    if (tab == 'l')
                        h = S.lists.filter(l => mt(l.name)).map(l => `<div ${cl(l.color, 'l')} data-ls="${l.id}"><span class="bell">${I.list}</span><div class="b"><div class="t">${esc(l.name)}</div><div class="w">${S.items.filter(i => !i.done && i.lists.includes(l.id)).length} pendentes</div></div>${I.next}</div>`).join('') || emp('<div class="em">Nenhuma lista ainda.<br>Toque em + para criar.</div>');
                    else if (tab == 'c') {
                        const d = S.items.filter(i => i.done && mt(i.title)).sort( (a, b) => b.when - a.when);
                        h = d.map(row).join('') || emp('<div class="em">Nada concluído ainda.</div>')
                    } else {
                        const a = pend(tab);
                        h = a.map(row).join('') || emp(`<div class="em">${tab == 'r' ? 'Nenhum lembrete.' : 'Nenhuma tarefa.'}<br>Toque em + para criar.</div>`)

                    d.setDate(d.getDate() + 7 * r.n);

                }
                return d.getTime()
            }
            function nextAfter(t, r) {
                let w = addI(t, r)
                  , k = 0;
                while (w <= Date.now() && k++ < 5000)
                    w = addI(w, r);
                return w

                });
                r.onsuccess = () => res(r.result);
                r.onerror = () => rej()
            }

                        const g = s.getAll();
                        g.onsuccess = () => r(g.result)
                    }
                    );
                    let c = 0;
                    all.forEach(z => {
                        const i = byId(z.id);
                        if (i && !i.rep) {
                            i.when = z.until;
                            i.done = false;
                            i.notified = false;
                            c++
                        }
                        s.delete(z.id)
                    }

                } catch (e) {}

                    }
                    if (b.dataset.q) {
                        $('#f-d').value = loc(Q[b.dataset.q]());
                        return
                    }
                    if (b.dataset.l) {
                        keep();
                        const l = b.dataset.l;
                        sel = sel.includes(l) ? sel.filter(x => x != l) : [...sel, l];
                        draw();
                        return
                    }
                    if (b.id == 'dl') {
                        unsched(it.id);
                        S.items = S.items.filter(x => x != it);
                        save();
                        close();
                        render()
                    }
                    if (b.id == 'sv') {
                        keep();
                        const t = draw.t.trim();
                        if (!t) {
                            $('#f-t').focus();
                            return
                        }
                        const w = draw.d;
                        if (it) {
                            Object.assign(it, {
                                type: ty,
                                title: t,
                                when: w,
                                lists: sel,
                                rep: rp,
                                color: col
                            });
                            if (w > Date.now()) {
                                it.done = false;
                                it.notified = false
                            }
                            unsched(it.id);
                            it.done || sched(it)
                        } else {
                            it = {
                                id: uid(),
                                type: ty,
                                title: t,
                                when: w,
                                done: false,
                                notified: false,
                                lists: sel,
                                rep: rp,
                                color: col
                            };
                            S.items.push(it);
                            sched(it)
                        }
                        if ('Notification' in window && Notification.permission == 'default')
                            Notification.requestPermission().then( () => sched(it));
                        save();
                        close();
                        render()
                    }
                }
                ;
            }
            const swt = c => `<div class="row">${PAL.map(x => `<button class="sw ${c == x ? 'on' : ''}" data-cs="${x}" style="background:${x}" aria-label="Cor"></button>`).join('')}<button class="sw none ${!c ? 'on' : ''}" data-cs="" aria-label="Sem cor">${I.x}</button></div>`;
            function listSheet(l) {
                let col = l && l.color || null
                  , n0 = l ? l.name : '';
                const draw = () => sh(`<input id="f-n" placeholder="Nome da lista" value="${esc(n0)}"><div class="lab">Cor</div>${swt(col)}<button class="go" id="sv">Salvar</button>${l ? '<button class="del" id="dl">Excluir lista</button>' : ''}`);
                draw();
                $('#f-n').focus();
                $('#sc').onclick = e => {
                    const b = e.target.closest('button');
                    if (!b)
                        return;
                    if (b.dataset.cs !== undefined) {
                        n0 = $('#f-n').value;
                        col = b.dataset.cs || null;
                        draw();
                        return
                    }
                    if (b.id == 'dl') {
                        S.lists = S.lists.filter(x => x != l);
                        S.items.forEach(i => i.lists = i.lists.filter(x => x != l.id));
                        cur = null;
                        save();
                        close();
                        render()
                    }
                    if (b.id == 'sv') {
                        const n = $('#f-n').value.trim();
                        if (!n)
                            return;
                        if (l) {
                            l.name = n;
                            l.color = col
                        } else
                            S.lists.push({
                                id: uid(),
                                name: n,
                                color: col
                            });
                        save();
                        close();
                        render()
                    }
                }
            }
            /* configurações */
            function applyCfg() {
                const C = S.cfg
                  , B = C.bg
                  , r = document.documentElement;
                r.dataset.th = C.th;
                r.style.setProperty('--pr', C.ac);
                let bg = '';
                if (B.k == 's')
                    bg = B.c1;
                else if (B.k == 'g')
                    bg = `linear-gradient(${B.a}deg,${B.c1},${B.c2})`;
                else if (B.k == 'i') {
                    const u = localStorage.getItem('lembra-bg');
                    if (u)
                        bg = `center/cover fixed url("${u}")`
                }
                document.body.style.background = bg;
                document.body.classList.toggle('cb', !!bg);
                document.querySelector('meta[name=theme-color]').content = C.ac
            }
            function cfgHtml() {
                const C = S.cfg
                  , B = C.bg
                  , ch = (on, d, l) => `<button class="chip ${on ? 'on' : ''}" ${d}>${l}</button>`;
                let ctl = '';
                if (B.k == 's')
                    ctl = `<div class="row">${BGS.map(c => `<button class="sw ${B.c1 == c ? 'on' : ''}" style="background:${c}" data-bc="${c}"></button>`).join('')}<input type="color" id="bg-c1" value="${B.c1}"></div>`;
                else if (B.k == 'g')
                    ctl = `<div class="pv" style="background:linear-gradient(${B.a}deg,${B.c1},${B.c2})"></div><div class="row" style="align-items:center"><input type="color" id="bg-c1" value="${B.c1}"><input type="color" id="bg-c2" value="${B.c2}"><span class="lab">Ângulo</span></div><input type="range" id="bg-a" min="0" max="360" value="${B.a}">`;
                else if (B.k == 'i')
                    ctl = `<div class="row">${ch(0, 'data-pick="1"', 'Escolher outra foto')}${ch(0, 'data-rm="1"', 'Remover foto')}</div>`;
                return `<h3>Aparência</h3><div class="cd"><div class="lab">Tema</div><div class="row">${[['a', 'Automático'], ['l', 'Claro'], ['d', 'Escuro']].map( ([k,l]) => ch(C.th == k, `data-th="${k}"`, l)).join('')}</div><div class="lab">Cor principal</div><div class="row" style="align-items:center">${ACC.map(c => `<button class="sw ${C.ac == c ? 'on' : ''}" style="background:${c}" data-ac="${c}"></button>`).join('')}<input type="color" id="ac-i" value="${C.ac}"></div></div>
<h3>Estilo dos itens</h3><div class="cd">${[['r', 'Lembretes'], ['t', 'Tarefas'], ['l', 'Listas']].map( ([k,n]) => `<div class="lab">${n}</div><div class="row">${[['p', 'Padrão'], ['c', 'Colorido'], ['m', 'Minimalista']].map( ([v,l]) => ch(C.st[k] == v, `data-st="${k}${v}"`, l)).join('')}</div>`).join('')}</div>
<h3>Fundo</h3><div class="cd"><div class="row">${[['n', 'Padrão'], ['s', 'Cor sólida'], ['g', 'Gradiente'], ['i', 'Foto']].map( ([k,l]) => ch(B.k == k, `data-bk="${k}"`, l)).join('')}</div>${ctl}<input type="file" accept="image/*" id="bgf" hidden></div>
<h3>Soneca nas notificações</h3><div class="cd"><div class="lab">Primeira ação</div><div class="row">${[5, 10, 15].map(m => ch(C.s1 == m, `data-s1="${m}"`, lbl(m))).join('')}</div><div class="lab">Segunda ação</div><div class="row">${[30, 60, 120].map(m => ch(C.s2 == m, `data-s2="${m}"`, lbl(m))).join('')}</div></div>`
            }
            function cfgClick(e) {
                const b = e.target.closest('button');
                if (!b)
                    return;
                const C = S.cfg
                  , B = C.bg
                  , d = b.dataset;
                if (d.th)
                    C.th = d.th;
                else if (d.ac)
                    C.ac = d.ac;
                else if (d.st)
                    C.st[d.st[0]] = d.st[1];
                else if (d.bk) {
                    if (d.bk == 'i' && !localStorage.getItem('lembra-bg')) {
                        $('#bgf').click();
                        return
                    }
                    B.k = d.bk
                } else if (d.bc)
                    B.c1 = d.bc;
                else if (d.s1)
                    C.s1 = +d.s1;
                else if (d.s2)
                    C.s2 = +d.s2;
                else if (d.rm) {
                    localStorage.removeItem('lembra-bg');
                    B.k = 'n'
                } else if (d.pick) {
                    $('#bgf').click();
                    return
                } else
                    return;
                save();
                applyCfg();
                render()
            }
            function loadImg(f) {
                const r = new FileReader();
                r.onload = () => {
                    const im = new Image();
                    im.onload = () => {
                        const k = Math.min(1, 1400 / Math.max(im.width, im.height))
                          , c = document.createElement('canvas');
                        c.width = im.width * k;
                        c.height = im.height * k;
                        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
                        try {
                            localStorage.setItem('lembra-bg', c.toDataURL('image/jpeg', .8));
                            S.cfg.bg.k = 'i';
                            save();
                            applyCfg();
                            render()
                        } catch (x) {
                            alert('Não foi possível salvar a foto.')
                        }
                    }
                    ;
                    im.src = r.result
                }
                ;
                r.readAsDataURL(f)
            }
            /* eventos */
            $('#sh').onclick = e => {
                if (e.target.id == 'sh')
                    close()
            }
            ;
            $('#nav').onclick = e => {
                const b = e.target.closest('[data-tab]');
                if (b) {
                    tab = b.dataset.tab;
                    cur = null;
                    cfgOpen = false;
                    q = '';
                    $('#sbi').value = '';
                    render()
                }
            }
            ;
            $('#bk').onclick = () => {
                if (cfgOpen)
                    cfgOpen = false;
                else
                    cur = null;
                render()
            }
            ;
            $('#cfg').onclick = () => {
                cfgOpen = true;
                render()
            }
            ;
            $('#sbt').onclick = () => {
                sbOpen = !sbOpen;
                if (!sbOpen) {
                    q = '';
                    $('#sbi').value = ''
                }
                render();
                if (sbOpen)
                    $('#sbi').focus()
            }
            ;
            $('#sbi').oninput = e => {
                q = e.target.value.trim();
                render()
            }
            ;
            $('#main').oninput = e => {
                const t = e.target
                  , C = S.cfg
                  , B = C.bg;
                if (t.id == 'ac-i')
                    C.ac = t.value;
                else if (t.id == 'bg-c1')
                    B.c1 = t.value;
                else if (t.id == 'bg-c2')
                    B.c2 = t.value;
                else if (t.id == 'bg-a')
                    B.a = +t.value;
                else
                    return;
                save();
                applyCfg();
                const p = $('.pv');
                if (p)
                    p.style.background = `linear-gradient(${B.a}deg,${B.c1},${B.c2})`
            }
            ;
            $('#main').onchange = e => {
                const t = e.target;
                if (t.id == 'bgf') {
                    if (t.files[0])
                        loadImg(t.files[0])
                } else if (cfgOpen && t.type)
                    render()
            }
            ;
            $('#ed').onclick = () => listSheet(S.lists.find(l => l.id == cur));
            $('#fab').onclick = () => tab == 'l' && !cur ? listSheet() : itemSheet();
            $('#main').onclick = e => {
                if (cfgOpen)
                    return cfgClick(e);
                const c = e.target.closest('[data-ck]');
                if (c) {
                    const i = byId(c.dataset.ck);
                    if (!i.done && i.rep) {
                        S.items.push({
                            ...i,
                            id: uid(),
                            done: true,
                            rep: null,
                            lists: [...i.lists]
                        });
                        unsched(i.id);
                        i.when = nextAfter(i.when, i.rep);
                        i.notified = false;
                        sched(i)
                    } else {
                        i.done = !i.done;
                        if (i.done)
                            unsched(i.id);
                        else {
                            i.notified = i.when <= Date.now();
                            sched(i)
                        }
                    }
                    save();
                    render();
                    return
                }
                const l = e.target.closest('[data-ls]');
                if (l) {
                    cur = l.dataset.ls;
                    q = '';
                    $('#sbi').value = '';
                    render();
                    return
                }
                const r = e.target.closest('[data-id]');
                if (r)
                    itemSheet(byId(r.dataset.id))
            }
            ;
            if ('serviceWorker' in navigator)
                navigator.serviceWorker.register('sw.js').then( () => navigator.serviceWorker.ready).then(r => {
                    reg = r;
                    S.items.forEach(i => !i.done && sched(i))
                }
                );
            let dp;
            addEventListener('beforeinstallprompt', e => {
                e.preventDefault();
                dp = e;
                $('#inst').hidden = false
            }
            );
            addEventListener('appinstalled', () => $('#inst').hidden = true);
            $('#inst').onclick = () => {
                dp && dp.prompt();
                dp = null;
                $('#inst').hidden = true
            }
            ;
            navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', () => check());
            setInterval(check, 5000);
            document.addEventListener('visibilitychange', () => !document.hidden && check());
            applyCfg();
            check();
            render();
        </script>
    </body>
</html>
