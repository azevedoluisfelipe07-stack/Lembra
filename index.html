<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lembra</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#3b8ef0"><link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{--bg:#f5f8fd;--cd:#fff;--tx:#14233a;--mu:#6b7c93;--pr:#3b8ef0;--pl:#e3effd;--bd:#e3e9f2;--rd:#e5484d;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1623;--cd:#18222f;--tx:#e8eef7;--mu:#8a9bb3;--pl:#1d3350;--bd:#26344a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:16px 20px 8px;display:flex;align-items:center;gap:10px}header h1{font-size:24px;margin:0;flex:1}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#main{flex:1;overflow:auto;padding:4px 16px 96px}
.it{display:flex;align-items:center;gap:12px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:8px 0}
.it .b{flex:1;min-width:0}.it .t{font-weight:600;overflow-wrap:anywhere}.it .w{font-size:13px;color:var(--mu);margin-top:2px}.it .w.o{color:var(--rd)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--pr);flex:none;display:grid;place-items:center;color:#fff;font-size:15px}.ck.on{background:var(--pr)}
.bell{width:26px;text-align:center;flex:none;font-size:18px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:20px 4px 4px}
.em{text-align:center;color:var(--mu);margin-top:64px;line-height:1.5}
nav{display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 8px;font-size:12px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}nav button span{display:flex}nav button.on{color:var(--pr);font-weight:600}
#fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--pr);color:#fff;font-size:30px;box-shadow:0 6px 18px #3b8ef066}
#sh{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:5}#sh.on{display:flex}
.sheet{background:var(--cd);width:100%;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}
.sheet input{width:100%;font:inherit;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{padding:8px 13px;border-radius:20px;background:var(--pl);font-size:14px}.chip.on{background:var(--pr);color:#fff}
.seg{display:flex;background:var(--pl);border-radius:12px;padding:3px}.seg button{flex:1;padding:9px;border-radius:10px}.seg .on{background:var(--pr);color:#fff}
.go{width:100%;background:var(--pr);color:#fff;padding:14px;border-radius:14px;font-weight:600;margin-top:10px}.del{width:100%;color:var(--rd);padding:12px}
.lab{font-size:13px;color:var(--mu);margin-top:10px}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.bell svg{color:var(--pr)}.seg svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px}.ck svg{width:16px;height:16px;stroke:#fff;stroke-width:3}#fab svg{width:28px;height:28px;stroke-width:2.5}#bk svg{width:26px;height:26px}.it>svg{color:var(--mu)}.chip svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px}.w svg{width:13px;height:13px;vertical-align:-2px;margin-right:2px}.sheet select{font:inherit;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}#f-n{width:80px}</style></head><body>
<header><button id="bk" hidden ></button><h1 id="ti"></h1><button id="inst" hidden class="chip">Instalar</button><button id="ed" hidden class="chip">Editar</button></header>
<div id="main"></div><button id="fab" aria-label="Adicionar"></button>
<nav id="nav"></nav><div id="sh"><div class="sheet" id="sc"></div></div>
<script>
const $=s=>document.querySelector(s);
let S=JSON.parse(localStorage.getItem('lembra')||'null')||{items:[],lists:[]},tab='r',cur=null,reg=null;
const save=()=>localStorage.setItem('lembra',JSON.stringify(S));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>new Date(t).toLocaleString('pt-BR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const loc=d=>new Date(d-new Date(d).getTimezoneOffset()*6e4).toISOString().slice(0,16);
const sv=p=>`<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const I={bell:sv('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>'),task:sv('<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>'),list:sv('<path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/>'),box:sv('<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/>'),plus:sv('<path d="M12 5v14M5 12h14"/>'),ok:sv('<path d="m5 12 5 5 9-10"/>'),next:sv('<path d="m9 6 6 6-6 6"/>'),back:sv('<path d="m15 6-6 6 6 6"/>'),rep:sv('<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>')};
$('#fab').innerHTML=I.plus;$('#bk').innerHTML=I.back;
const TABS=[['r','bell','Lembretes'],['t','task','Tarefas'],['l','list','Listas'],['c','box','Concluídos']];
const byId=id=>S.items.find(i=>i.id==id);
function row(i){const o=i.type=='t'&&!i.done&&i.when<Date.now();
return `<div class="it" data-id="${i.id}">${i.type=='t'?`<button class="ck ${i.done?'on':''}" data-ck="${i.id}" aria-label="Concluir">${i.done?I.ok:''}</button>`:`<span class="bell">${I.bell}</span>`}<div class="b"><div class="t">${esc(i.title)}</div><div class="w ${o?'o':''}">${fmt(i.when)}${i.rep?` · ${I.rep}${repTxt(i.rep)}`:''}</div></div></div>`}
const pend=ty=>S.items.filter(i=>i.type==ty&&!i.done).sort((a,b)=>a.when-b.when);
function render(){
$('#nav').innerHTML=TABS.map(([k,e,n])=>`<button class="${k==tab?'on':''}" data-tab="${k}"><span>${I[e]}</span>${n}</button>`).join('');
$('#bk').hidden=$('#ed').hidden=!cur;$('#fab').hidden=tab=='c'&&!cur;
let h='',m=$('#main');
if(cur){const L=S.lists.find(l=>l.id==cur);$('#ti').textContent=L.name;const mine=ty=>pend(ty).filter(i=>i.lists.includes(cur));
const t=mine('t'),r=mine('r');h=(t.length?'<h3>Tarefas</h3>'+t.map(row).join(''):'')+(r.length?'<h3>Lembretes</h3>'+r.map(row).join(''):'')||'<div class="em">Lista vazia.<br>Toque em + para adicionar.</div>'}
else{$('#ti').textContent=TABS.find(x=>x[0]==tab)[2];
if(tab=='l')h=S.lists.map(l=>`<div class="it" data-ls="${l.id}"><span class="bell">${I.list}</span><div class="b"><div class="t">${esc(l.name)}</div><div class="w">${S.items.filter(i=>!i.done&&i.lists.includes(l.id)).length} pendentes</div></div>${I.next}</div>`).join('')||'<div class="em">Nenhuma lista ainda.<br>Toque em + para criar.</div>';
else if(tab=='c'){const d=S.items.filter(i=>i.done).sort((a,b)=>b.when-a.when);h=d.map(row).join('')||'<div class="em">Nada concluído ainda.</div>'}
else{const a=pend(tab);h=a.map(row).join('')||`<div class="em">${tab=='r'?'Nenhum lembrete.':'Nenhuma tarefa.'}<br>Toque em + para criar.</div>`}}
m.innerHTML=h}
/* repetição */
const U={d:'dias',w:'semanas',m:'meses',a:'anos'},U1={d:'todo dia',w:'toda semana',m:'todo mês',a:'todo ano'};
const repTxt=r=>r.n==1?U1[r.u]:`a cada ${r.n} ${U[r.u]}`;
function addI(t,r){const d=new Date(t);if(r.u=='d')d.setDate(d.getDate()+r.n);else if(r.u=='w')d.setDate(d.getDate()+7*r.n);else{const day=d.getDate(),m=r.u=='a'?12*r.n:r.n;d.setDate(1);d.setMonth(d.getMonth()+m);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}return d.getTime()}
function nextAfter(t,r){let w=addI(t,r),k=0;while(w<=Date.now()&&k++<5000)w=addI(w,r);return w}
/* notificações */
function sched(i){try{if(reg&&'showTrigger'in Notification.prototype&&i.when>Date.now()&&Notification.permission=='granted')reg.showNotification(i.type=='r'?'Lembrete':'Tarefa',{body:i.title,tag:i.id+'-'+i.when,icon:'icons/icon-192.png',badge:'icons/icon-192.png',showTrigger:new TimestampTrigger(i.when)})}catch(e){}}
function unsched(id){try{reg&&reg.getNotifications({includeTriggered:true}).then(n=>n.filter(x=>x.tag.startsWith(id)).forEach(x=>x.close()))}catch(e){}}
function fire(i){if(Notification.permission!='granted')return;const o={body:i.title,tag:i.id+'-'+i.when,icon:'icons/icon-192.png',badge:'icons/icon-192.png'},t=i.type=='r'?'Lembrete':'Tarefa';try{reg?reg.showNotification(t,o):new Notification(t,o)}catch(e){}}
function check(){let c=0;S.items.forEach(i=>{if(!i.done&&!i.notified&&i.when<=Date.now()){fire(i);if(i.rep&&i.type=='r'){i.when=nextAfter(i.when,i.rep);i.notified=false;sched(i)}else{i.notified=true;if(i.type=='r')i.done=true}c++}});if(c){save();render()}}
/* sheet */
const sh=h=>{$('#sc').innerHTML=h;$('#sh').classList.add('on')},close=()=>$('#sh').classList.remove('on');
function itemSheet(it){const n=!it;let ty=it?it.type:(tab=='t'?'t':'r');let sel=it?[...it.lists]:(cur?[cur]:[]),rp=it&&it.rep?{...it.rep}:null;
const d=it?it.when:(Math.ceil((Date.now()+36e5)/9e5)*9e5);
const draw=()=>{sh(`<div class="seg"><button data-ty="r" class="${ty=='r'?'on':''}">${I.bell}Lembrete</button><button data-ty="t" class="${ty=='t'?'on':''}">${I.task}Tarefa</button></div>
<input id="f-t" placeholder="O que você precisa lembrar?" value="${esc(draw.t!==undefined?draw.t:(it?it.title:''))}"><input id="f-d" type="datetime-local" value="${loc(draw.d||d)}">
<div class="row">${[['Em 1 h',()=>Date.now()+36e5],['Hoje 18h',()=>new Date().setHours(18,0,0,0)],['Amanhã 9h',()=>new Date(Date.now()+864e5).setHours(9,0,0,0)]].map(([l],k)=>`<button class="chip" data-q="${k}">${l}</button>`).join('')}</div>
<div class="lab">Repetir</div><div class="row" style="align-items:center"><button class="chip ${rp?'on':''}" data-rp="1">${I.rep}${rp?'Repete':'Não repete'}</button>${rp?`<span>a cada</span><input id="f-n" type="number" min="1" max="999" value="${rp.n}"><select id="f-u">${[['d','dia(s)'],['w','semana(s)'],['m','mês(es)'],['a','ano(s)']].map(([k,l])=>`<option value="${k}" ${rp.u==k?'selected':''}>${l}</option>`).join('')}</select>`:''}</div>
${S.lists.length?`<div class="lab">Listas</div><div class="row">${S.lists.map(l=>`<button class="chip ${sel.includes(l.id)?'on':''}" data-l="${l.id}">${esc(l.name)}</button>`).join('')}</div>`:''}
<button class="go" id="sv">Salvar</button>${n?'':'<button class="del" id="dl">Excluir</button>'}`)};
const keep=()=>{draw.t=$('#f-t').value;draw.d=new Date($('#f-d').value).getTime()||d;if(rp&&$('#f-n'))rp={n:Math.max(1,Math.floor(+$('#f-n').value)||1),u:$('#f-u').value}};
const Q=[()=>Date.now()+36e5,()=>new Date().setHours(18,0,0,0),()=>new Date(Date.now()+864e5).setHours(9,0,0,0)];
draw();$('#f-t').focus();
$('#sc').onclick=e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.ty){keep();ty=b.dataset.ty;draw();return}
if(b.dataset.rp){keep();rp=rp?null:{n:1,u:'m'};draw();return}
if(b.dataset.q){$('#f-d').value=loc(Q[b.dataset.q]());return}
if(b.dataset.l){keep();const l=b.dataset.l;sel=sel.includes(l)?sel.filter(x=>x!=l):[...sel,l];draw();return}
if(b.id=='dl'){unsched(it.id);S.items=S.items.filter(x=>x!=it);save();close();render()}
if(b.id=='sv'){keep();const t=draw.t.trim();if(!t){$('#f-t').focus();return}const w=draw.d;
if(it){Object.assign(it,{type:ty,title:t,when:w,lists:sel,rep:rp});if(w>Date.now()){it.done=false;it.notified=false}unsched(it.id);it.done||sched(it)}
else{it={id:uid(),type:ty,title:t,when:w,done:false,notified:false,lists:sel,rep:rp};S.items.push(it);sched(it)}
if('Notification'in window&&Notification.permission=='default')Notification.requestPermission().then(()=>sched(it));
save();close();render()}};
}
function listSheet(l){sh(`<input id="f-n" placeholder="Nome da lista" value="${l?esc(l.name):''}"><button class="go" id="sv">Salvar</button>${l?'<button class="del" id="dl">Excluir lista</button>':''}`);$('#f-n').focus();
$('#sc').onclick=e=>{const b=e.target.closest('button');if(!b)return;
if(b.id=='dl'){S.lists=S.lists.filter(x=>x!=l);S.items.forEach(i=>i.lists=i.lists.filter(x=>x!=l.id));cur=null;save();close();render()}
if(b.id=='sv'){const n=$('#f-n').value.trim();if(!n)return;l?l.name=n:S.lists.push({id:uid(),name:n});save();close();render()}}}
/* eventos */
$('#sh').onclick=e=>{if(e.target.id=='sh')close()};
$('#nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;cur=null;render()}};
$('#bk').onclick=()=>{cur=null;render()};
$('#ed').onclick=()=>listSheet(S.lists.find(l=>l.id==cur));
$('#fab').onclick=()=>tab=='l'&&!cur?listSheet():itemSheet();
$('#main').onclick=e=>{const c=e.target.closest('[data-ck]');
if(c){const i=byId(c.dataset.ck);if(!i.done&&i.rep){S.items.push({...i,id:uid(),done:true,rep:null,lists:[...i.lists]});unsched(i.id);i.when=nextAfter(i.when,i.rep);i.notified=false;sched(i)}else{i.done=!i.done;if(i.done)unsched(i.id);else{i.notified=i.when<=Date.now();sched(i)}}save();render();return}
const l=e.target.closest('[data-ls]');if(l){cur=l.dataset.ls;render();return}
const r=e.target.closest('[data-id]');if(r)itemSheet(byId(r.dataset.id))};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(r=>{reg=r;S.items.forEach(i=>!i.done&&sched(i))});
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').hidden=false});addEventListener('appinstalled',()=>$('#inst').hidden=true);$('#inst').onclick=()=>{dp&&dp.prompt();dp=null;$('#inst').hidden=true};
setInterval(check,5000);document.addEventListener('visibilitychange',()=>!document.hidden&&check());
check();render();
</script></body></html>
